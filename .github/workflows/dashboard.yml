name: Dashboard checks
on:
  pull_request:
    paths:
      - 'dashboard/**'
      - '.streamlit/**'
      - 'scripts/export_dashboard.py'
      - 'scripts/train_baseline.py'
      - 'tests/**'
      - '.github/workflows/dashboard.yml'
  push:
    branches: [main, codex/model-dashboard]
    paths:
      - 'dashboard/**'
      - '.streamlit/**'
      - 'scripts/export_dashboard.py'
      - 'scripts/train_baseline.py'
      - 'tests/**'
      - '.github/workflows/dashboard.yml'
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: dashboard/requirements.txt
      - run: pip install -r requirements.txt -r dashboard/requirements.txt
      - run: python -m pytest -q
        env:
          OPENBLAS_NUM_THREADS: '1'
          OMP_NUM_THREADS: '1'
